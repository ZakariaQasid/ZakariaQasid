<rect width="1200" height="320" fill="url(#fade)"/>
<style>
.rise{animation:rs 9s linear infinite;opacity:0}@keyframes rs{0%{transform:translateY(0);opacity:0}15%{opacity:.9}85%{opacity:.6}100%{transform:translateY(-90px);opacity:0}}
.glow{animation:gp 3.2s ease-in-out infinite alternate}@keyframes gp{from{opacity:.15}to{opacity:.6}}
.sweep{animation:sw 7s ease-in-out infinite}@keyframes sw{0%{transform:translateX(-500px) skewX(-20deg)}55%,100%{transform:translateX(1500px) skewX(-20deg)}}
</style>
