</defs>
<style>
  .o1{animation:d1 9s ease-in-out infinite alternate} .o2{animation:d2 11s ease-in-out infinite alternate}
  @keyframes d1{from{transform:translate(0,0)}to{transform:translate(120px,30px)}}
  @keyframes d2{from{transform:translate(0,0)}to{transform:translate(-140px,-20px)}}
  .rule{transform-origin:600px 190px;animation:grow 3s ease-out both}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .fade{animation:fi 1.6s ease-out both} .fade2{animation:fi 1.6s .5s ease-out both} .fade3{animation:fi 1.6s 1s ease-out both}
  @keyframes fi{from{opacity:0}to{opacity:1}}
  .blink{animation:bl 1.4s steps(1) infinite} @keyframes bl{50%{opacity:0}}
</style>
