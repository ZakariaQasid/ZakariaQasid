<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04070d"/><stop offset="0.6" stop-color="#0a1830"/><stop offset="1" stop-color="#0d2b52"/></linearGradient>
