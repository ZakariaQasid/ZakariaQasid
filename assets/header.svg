<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Zakaria Qasid, Founder and CEO of ZyTech" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04070d"/><stop offset="0.6" stop-color="#0a1830"/><stop offset="1" stop-color="#0d2b52"/></linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8fd0ff"/></linearGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2196F3" stop-opacity="0"/><stop offset="0.5" stop-color="#4dc3ff"/><stop offset="1" stop-color="#7C4DFF" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2196F3" stroke-opacity="0.10" stroke-width="1"/></pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <radialGradient id="fade" cx="0.5" cy="0.5" r="0.7"><stop offset="0.4" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/></radialGradient>
</defs>
<style>
  .o1{animation:d1 9s ease-in-out infinite alternate} .o2{animation:d2 11s ease-in-out infinite alternate}
  @keyframes d1{from{transform:translate(0,0)}to{transform:translate(120px,30px)}}
  @keyframes d2{from{transform:translate(0,0)}to{transform:translate(-140px,-20px)}}
  .rule{transform-origin:600px 190px;animation:grow 3s ease-out both}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .fade{animation:fi 1.6s ease-out both} .fade2{animation:fi 1.6s .5s ease-out both} .fade3{animation:fi 1.6s 1s ease-out both}
  @keyframes fi{from{opacity:0}to{opacity:1}}
  .blink{animation:bl 1.4s steps(1) infinite} @keyframes bl{50%{opacity:0}}
</style>
<rect width="1200" height="320" fill="url(#bg)"/>
<rect width="1200" height="320" fill="url(#grid)"/>
<g filter="url(#blur)"><circle class="o1" cx="250" cy="120" r="110" fill="#2196F3" fill-opacity="0.55"/><circle class="o2" cx="950" cy="210" r="120" fill="#7C4DFF" fill-opacity="0.45"/></g>
<rect width="1200" height="320" fill="url(#fade)"/>
<rect x="24" y="24" width="1152" height="272" rx="14" fill="none" stroke="#4dc3ff" stroke-opacity="0.25"/>
<g fill="#4dc3ff" fill-opacity="0.9"><rect x="24" y="24" width="22" height="2"/><rect x="24" y="24" width="2" height="22"/><rect x="1154" y="24" width="22" height="2"/><rect x="1174" y="24" width="2" height="22"/><rect x="24" y="294" width="22" height="2"/><rect x="24" y="274" width="2" height="22"/><rect x="1154" y="294" width="22" height="2"/><rect x="1174" y="274" width="2" height="22"/></g>
<text x="52" y="58" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="13" fill="#7fc8ff" letter-spacing="3">// ZYTECH GLOBAL INFRASTRUCTURE</text>
<text x="1148" y="58" text-anchor="end" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="13" fill="#7fc8ff" letter-spacing="3">CASABLANCA · MA</text>
<text class="fade" x="600" y="164" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="78" font-weight="700" fill="url(#name)" letter-spacing="3">Zakaria Qasid</text>
<rect class="rule" x="300" y="190" width="600" height="2" fill="url(#rule)"/>
<text class="fade2" x="600" y="228" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#d6ecff" letter-spacing="9">FOUNDER &amp; CEO  ·  ZYTECH</text>
<text class="fade3" x="600" y="266" text-anchor="middle" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="15" fill="#7fc8ff" letter-spacing="2">local-first  /  privacy by design  /  digital sovereignty<tspan class="blink" fill="#4dc3ff"> _</tspan></text>
</svg>